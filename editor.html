<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Code Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: white; margin: 0; padding: 0; }
        #editor-container { width: 100%; height: 80vh; border: 1px solid #ccc; }
        #controls { padding: 10px; text-align: left; }
        button { margin-right: 10px; padding: 8px 12px; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Real-Time Code Editor</h1>
    <div id="controls">
        <button onclick="saveFile()">Save File</button>
        <button onclick="openFile()">Open File</button>
    </div>
    <div id="editor-container"></div>
    
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs' }});
        require(["vs/editor/editor.main"], function () {
            const editor = monaco.editor.create(document.getElementById("editor-container"), {
                value: "", 
                language: "javascript",
                theme: "vs-dark",
                automaticLayout: true
            });

            const socket = io("http://localhost:5000");
            const roomId = new URLSearchParams(window.location.search).get("room") || "default";
            const username = prompt("Enter your name:") || "Guest";
            socket.emit("joinRoom", { roomId, username });

            socket.on("codeUpdate", ({ code }) => {
                if (editor.getValue() !== code) {
                    editor.setValue(code);
                }
            });

            let lastCode = "";
            editor.onDidChangeModelContent(() => {
                const code = editor.getValue();
                if (code !== lastCode) {
                    lastCode = code;
                    socket.emit("codeChange", { roomId, code });
                }
            });

            function saveFile() {
                const blob = new Blob([editor.getValue()], { type: "text/plain" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "code.txt";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            function openFile() {
                const input = document.createElement("input");
                input.type = "file";
                input.accept = "text/plain";
                input.onchange = event => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => editor.setValue(reader.result);
                    reader.readAsText(file);
                };
                input.click();
            }
        });
    </script>
</body>
</html>
