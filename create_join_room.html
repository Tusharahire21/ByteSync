<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create or Join Room</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Background Styling */
        body {
            background: url('back.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Overlay for better readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark transparent overlay */
            z-index: 1;
        }

        /* Centered Container */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }

        h1, p {
            color: white;
            margin-bottom: 1rem;
        }

        .room-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Stylish Buttons */
        button {
            background-color: white;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #f5f5f5;
        }

        /* Styled Input Field */
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            width: 100%;
            text-align: center;
            font-size: 16px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Overlay for better readability -->
    <div class="overlay"></div>

    <div class="container">
        <h1>Welcome!</h1>
        <p>Create a new room or join an existing one to start collaborating in real-time.</p>
        
        <div class="room-options">
            <button id="createRoomBtn">Create New Room</button>
            <input type="text" id="roomId" placeholder="Enter Room ID">
            <button id="joinRoomBtn">Join Room</button>
        </div>
    </div>
    
    <script>
        document.getElementById("createRoomBtn").addEventListener("click", () => {
            const roomId = Math.random().toString(36).substr(2, 8); // Generate a random room ID
            alert("Room Created! Room ID: " + roomId);
            window.location.href = `monaco-editor-page.html?room=${roomId}`;
        });

        document.getElementById("joinRoomBtn").addEventListener("click", () => {
            const roomId = document.getElementById("roomId").value.trim();
            if (roomId) {
                window.location.href = `monaco-editor-page.html?room=${roomId}`;
            } else {
                alert("Please enter a valid Room ID.");
            }
        });
    </script>

</body>
</html>
