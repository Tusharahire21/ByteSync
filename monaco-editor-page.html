<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Code Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; display: flex; background-color: #1e1e1e; color: white; }
        .container { display: flex; width: 100%; height: 100vh; }
        .sidebar { width: 300px; background: #252526; padding: 20px; border-right: 1px solid #333; }
        .editor-section { flex: 1; display: flex; flex-direction: column; }
        #editor { flex: 1; }
        .toolbar { padding: 10px; background: #252526; border-bottom: 1px solid #333; display: flex; gap: 10px; }
        button, input { padding: 10px; border-radius: 5px; border: none; cursor: pointer; }
        button { background: #007acc; color: white; }
        button:hover { background: #005f99; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Collaboration Room</h3>
            <p id="roomId">Room: ...</p>
            <h3>Developers</h3>
            <div id="collaboratorsList"></div>
            <input type="file" id="openFile" accept=".txt">
            <button onclick="saveFile()">Save File</button>
        </div>
        <div class="editor-section">
            <div class="toolbar">
                <button onclick="saveFile()">Save</button>
                <button onclick="document.getElementById('openFile').click()">Open</button>
            </div>
            <div id="editor"></div>
        </div>
    </div>
    <script>
        let editor, socket, username;
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default-room';

        username = prompt("Enter your name:") || "User";

        function initializeSocket() {
            socket = io('http://localhost:5000');
            socket.on('connect', () => {
                document.getElementById('roomId').textContent = `Room: ${roomId}`;
                socket.emit('joinRoom', { roomId, username });
            });

            socket.on('updateUsers', ({ users }) => {
                document.getElementById('collaboratorsList').innerHTML = users.map(user => `<p>${user}</p>`).join('');
            });

            socket.on('codeUpdate', ({ code }) => {
                if (editor.getValue() !== code) {
                    editor.setValue(code);
                }
            });
        }

        function initializeEditor() {
            require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('editor'), {
                    value: '// Start coding...\n',
                    language: 'javascript',
                    theme: 'vs-dark'
                });
                editor.onDidChangeModelContent(() => {
                    socket.emit('codeChange', { roomId, code: editor.getValue() });
                });
            });
        }

        function saveFile() {
            const blob = new Blob([editor.getValue()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'code.txt';
            a.click();
        }

        document.getElementById('openFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editor.setValue(e.target.result);
                };
                reader.readAsText(file);
            }
        });

        initializeSocket();
        initializeEditor();
    </script>
</body>
</html>
