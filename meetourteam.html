<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteSync - Meet Our Team</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #FFFFFF;
            color: #1F1C2C;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .navbar {
            background-color: #1F1C2C;
            padding: 0.5rem 1rem;
        }
        .navbar-brand, .nav-link {
            color: #FFFFFF !important;
        }
        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 2rem;
        }
        #about-us h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: bold;
            color: #1F1C2C;
        }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .profile-card {
            text-align: center;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 250px;
        }
        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .profile-card:hover .profile-pic {
            transform: scale(1.1);
        }
        .profile-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ByteSync</a>
        </div>
    </nav>

    <section id="about-us" class="section">
        <h2>Meet Our Team</h2>
        <div class="container">
            <div class="row">
                <div class="col-md-3 profile-card">
                    <img src="profile1.jpg" alt="Bhagyesh Kudase" class="profile-pic">
                    <h5 class="mt-3">Bhagyesh Kudase</h5>
                    <p class="profile-info">Project Manager & QA Engineer</p>
                </div>
                <div class="col-md-3 profile-card">
                    <img src="profile2.jpg" alt="Yogesh Chavvan" class="profile-pic">
                    <h5 class="mt-3">Yogesh Chavvan</h5>
                    <p class="profile-info">Backend Developer & Database Manager</p>
                </div>
                <div class="col-md-3 profile-card">
                    <img src="profile3.jpg" alt="Tushar Ahire" class="profile-pic">
                    <h5 class="mt-3">Tushar Ahire</h5>
                    <p class="profile-info">API Integration & Deployment Specialist</p>
                </div>
                <div class="col-md-3 profile-card">
                    <img src="profile4.jpg" alt="Vedant Ahire" class="profile-pic">
                    <h5 class="mt-3">Vedant Ahire</h5>
                    <p class="profile-info">Frontend Developer & Designer</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
